name: panthalassa_parsers
description: >-
  Pure-Dart, zero-FFI document parsers for healthcare, EDI, binary, PDF, office,
  EPUB, email, HTML, Markdown, CSV and common image documents, with
  SHA-256/384/512 content addressing.
version: 0.5.2
homepage: https://github.com/turkananation/panthalassa_parsers
repository: https://github.com/turkananation/panthalassa_parsers

environment:
  sdk: '^3.12.0'

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - documents
  - parsers

executables:
  panthalassa: panthalassa

dependencies:
  archive: ^4.6.0   # pure-Dart ZIP + inflate (ODF container, PDF FlateDecode); no dart:io
  args: ^2.7.0      # CLI argument/subcommand parsing (bin/ only)
  image: ^4.12.0    # JPEG decode + PNG encode for DICOM pixel rendering; pure Dart
  meta: ^1.16.0
  pointycastle: ^4.0.0  # SHA-2 digests for the web/WASM hash backend
  pqforge: ^0.4.14  # PqBytes SHA-256/SHA-384/SHA-512 — native hash path
  swissarmyknife: ^0.1.0  # safe JSON traversal, collection/byte helpers, bounded task queue
  xml: ^7.1.0       # FHIR/XML + ODF/OOXML content

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
