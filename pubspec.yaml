name: panthalassa_parsers
description: >-
  Pure-Dart, zero-FFI parsers for structured, binary, and composite document
  formats (FHIR/XML, USMTF, EDIFACT, STEP, DICOM, NITF, the STANAG family, PDF, ODF).
  Produces content-addressed, isolate-safe parse results for the Panthalassa Vault.
version: 0.4.0
publish_to: none

environment:
  sdk: '^3.10.3'

resolution: workspace

dependencies:
  archive: ^4.0.9   # pure-Dart ZIP + inflate (ODF container, PDF FlateDecode); no dart:io
  meta: ^1.16.0
  pqforge: ^0.3.0   # PqBytes.sha256 — single hash implementation across the vault
  xml: ^6.5.0       # FHIR/XML + ODF content.xml

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
