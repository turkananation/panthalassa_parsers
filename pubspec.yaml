name: panthalassa_parsers
description: >-
  Pure-Dart, zero-FFI parsers for structured, binary, and composite document
  formats (FHIR/XML, USMTF, EDIFACT, STEP, DICOM, NITF, the STANAG family, PDF, ODF).
  Produces content-addressed, isolate-safe parse results for the Panthalassa Vault.
version: 0.5.0
homepage: https://turkananation.github.io/panthalassa_parsers
repository: https://github.com/turkananation/panthalassa_parsers

environment:
  sdk: '^3.10.3'

resolution: workspace

# This package supports all platforms listed below.
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - documents
  - parsers

dependencies:
  archive: ^4.0.9   # pure-Dart ZIP + inflate (ODF container, PDF FlateDecode); no dart:io
  meta: ^1.16.0
  pointycastle: ^4.0.0
  pqforge: ^0.4.3   # PqBytes.sha256 — single hash implementation across the vault
  xml: ^6.5.0       # FHIR/XML + ODF content.xml

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
