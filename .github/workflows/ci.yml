name: panthalassa_parsers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - run: dart run tool/version/generate_version.dart --check
      - run: dart analyze
      - run: dart test
      - run: dart run bin/panthalassa.dart version --json
      - run: dart run bin/panthalassa.dart formats --json > /dev/null
      - run: dart run bin/panthalassa.dart parse README.md --json > /dev/null
      - run: dart compile exe bin/panthalassa.dart -o /tmp/panthalassa_cli
      - run: dart compile js -O2 -o /tmp/panthalassa_web_smoke.js tool/web_smoke.dart
